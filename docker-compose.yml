name: honey

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    entrypoint: ["/bin/bash", "/docker-entrypoint-custom.sh"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/entrypoint.sh:/docker-entrypoint-custom.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' -q -t"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:17
    network_mode: host
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    entrypoint: ["psql"]
    command: ["-h", "127.0.0.1", "-p", "${POSTGRES_PORT}", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-v", "ON_ERROR_STOP=1", "-f", "/schema.sql"]
    volumes:
      - ./postgres/schema.sql:/schema.sql:ro
    restart: "no"

  cowrie:
    build: ./cowrie
    container_name: cowrie
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - ./config/cowrie.cfg:/tmp/cowrie.cfg.template:ro
      - ./cowrie/var/log/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - ./cowrie/var/lib/cowrie:/cowrie/cowrie-git/var/lib/cowrie

  # GeoIP database downloader: runs once, skips if the databases exist
  geoip-init:
    build:
      context: ./scripts
      dockerfile: Dockerfile.geoip-init
    restart: "no"
    environment:
      - GEOIP_DIR=/geoip
    volumes:
      - ./scripts/geoip-init.sh:/geoip-init.sh:ro
      - geoip:/geoip
    entrypoint: ["/bin/sh", "/geoip-init.sh"]

  # Stats generator: runs on startup, then every 5 minutes
  stats-gen:
    build: .
    image: honey:local
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - STATS_DIR=/stats
      - WORDLIST_DIR=/wordlists
      - GEOIP_COUNTRY_DB=/geoip/country.mmdb
      - GEOIP_ASN_DB=/geoip/asn.mmdb
    volumes:
      - stats:/stats
      - wordlists:/wordlists:ro
      - geoip:/geoip:ro
    entrypoint: ["/usr/local/bin/stats-gen.sh"]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      geoip-init:
        condition: service_completed_successfully

  # Bloom filter builder: runs once, skips if a current-format filter exists
  bloom-init:
    build: .
    image: honey:local
    restart: "no"
    network_mode: host
    environment:
      - BLOOM_DIR=/bloom
      # Space-separated URLs, streamed one at a time and never written to disk.
      # Lists: xato-net 1 M, NCSC 100 k, Pwdb top 1 M, probable top 12 k, darkweb 2017 top 10 k.
      # Override in .env to customise.
      - BLOOM_WORDLIST_URLS=${BLOOM_WORDLIST_URLS:-https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/xato-net-10-million-passwords-1000000.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/100k-most-used-passwords-NCSC.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/Pwdb_top-1000000.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/probable-v2_top-12000.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/darkweb2017_top-10000.txt}
    volumes:
      - bloom:/bloom
    entrypoint: ["honey-bloom"]

  # Wordlist generator: runs on startup, then every 6 hours
  wordlist-gen:
    build: .
    image: honey:local
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - WORDLIST_DIR=/wordlists
      - BLOOM_DIR=/bloom
    volumes:
      - wordlists:/wordlists
      - bloom:/bloom
    entrypoint: ["/usr/local/bin/wordlist-gen.sh"]
    depends_on:
      bloom-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully

  # Stats dashboard: serves the files from stats-gen and wordlist-gen
  web:
    build: .
    image: honey:local
    container_name: web
    user: nobody
    entrypoint: ["honey-web"]
    restart: unless-stopped
    network_mode: host
    environment:
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE:-0.5}
      - WORDLIST_DIR=/wordlists
      - STATS_DIR=/stats
    volumes:
      - wordlists:/wordlists:ro
      - stats:/stats:ro

  # Nginx: routes ports 80 and 443 by Host header
  nginx:
    build: ./nginx
    container_name: nginx
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - TARGET_HOST=${TARGET_HOST}
    volumes:
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web

  # Certbot: renews certificates every 12 hours
  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    network_mode: host
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  postgres-data:
  wordlists:
  stats:
  bloom:
  geoip:
