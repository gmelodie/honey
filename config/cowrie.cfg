[honeypot]
sensor_name = cowrie
# Cap each attacker download at 10 MiB so samples cannot fill the disk.
download_limit_size = 10485760

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true

[output_postgresql]
enabled = true
host = ${POSTGRES_HOST}
port = ${POSTGRES_PORT}
database = ${POSTGRES_DB}
username = ${POSTGRES_USER}
password = ${POSTGRES_PASSWORD}

