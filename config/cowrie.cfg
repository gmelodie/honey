[honeypot]
sensor_name = cowrie
hostname = db-prod-02
# Cap each attacker download at 10 MiB so samples cannot fill the disk.
download_limit_size = 10485760

[shell]
filesystem = /cowrie/cowrie-git/etc/fs.pickle
# Must match the [ssh] banner from cowrie.cfg.dist, or `ssh -V` contradicts it.
ssh_version = OpenSSH_9.2p1 Debian-2+deb12u3, OpenSSL 3.0.13 30 Jan 2024

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true

[output_postgresql]
enabled = true
host = ${POSTGRES_HOST}
port = ${POSTGRES_PORT}
database = ${POSTGRES_DB}
username = ${POSTGRES_USER}
password = ${POSTGRES_PASSWORD}

