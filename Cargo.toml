[package]
name = "honey"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "=1.1.10"
maxminddb = "=0.32.0"
postgres = { version = "=0.19.14", features = ["with-chrono-0_4", "with-serde_json-1"] }
reqwest = { version = "=0.13.5", features = ["json", "form", "blocking"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_return = "deny"
use_self = "warn"
cast_precision_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
implicit_hasher = "allow"
